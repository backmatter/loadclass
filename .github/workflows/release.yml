name: Release

# Checks run on every push to main. release-please keeps a release PR open from
# Conventional Commits; merging it tags `loadclass-vX.Y.Z` and the images are
# built and pushed under that tag in the same run (tags created with the
# workflow token don't trigger other workflows). The infra deploy script deploys
# by the same tag.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true

      - run: vp check

      - run: vp run typecheck

      - run: vp run build

      # No users yet: releases stay on 1.x. A breaking-change marker would make
      # release-please propose 2.0.0; stop that release here.
      - name: Keep releases on 1.x
        run: node -e 'const v = require("./.release-please-manifest.json")["."]; if (!v.startsWith("1.")) { console.error(`Release version ${v} leaves 1.x`); process.exit(1); }'

  release:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      WEB_IMAGE: ghcr.io/${{ github.repository }}/web
      PREVIEW_WORKER_IMAGE: ghcr.io/${{ github.repository }}/preview-worker

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ needs.release.outputs.tag_name }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ needs.release.outputs.tag_name }}

      - name: Build and push preview worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile.preview
          push: true
          tags: |
            ${{ env.PREVIEW_WORKER_IMAGE }}:latest
            ${{ env.PREVIEW_WORKER_IMAGE }}:${{ needs.release.outputs.tag_name }}
