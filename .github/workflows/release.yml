name: Release

# Checks run on main. Pushing a `loadclass-v*` tag also builds and pushes the
# images under that tag; the infra deploy script deploys by the same tag.
on:
  push:
    branches:
      - main
    tags:
      - "loadclass-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true

      - run: vp check

      - run: vp run typecheck

      - run: vp run test

      - run: vp run build

  images:
    runs-on: ubuntu-latest
    needs: checks
    if: startsWith(github.ref, 'refs/tags/loadclass-v')
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      WEB_IMAGE: ghcr.io/${{ github.repository }}/web
      PREVIEW_WORKER_IMAGE: ghcr.io/${{ github.repository }}/preview-worker

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.ref_name }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.ref_name }}

      - name: Build and push preview worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile.preview
          push: true
          tags: |
            ${{ env.PREVIEW_WORKER_IMAGE }}:latest
            ${{ env.PREVIEW_WORKER_IMAGE }}:${{ github.ref_name }}
