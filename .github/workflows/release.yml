name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run typecheck

      - run: bun run build

      - run: bun run --cwd apps/web test

  release:
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      WEB_IMAGE: ghcr.io/${{ github.repository }}/web
      PREVIEW_WORKER_IMAGE: ghcr.io/${{ github.repository }}/preview-worker

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ needs.release.outputs.tag_name }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ needs.release.outputs.tag_name }}

      - name: Build and push preview worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile.preview
          push: true
          tags: |
            ${{ env.PREVIEW_WORKER_IMAGE }}:latest
            ${{ env.PREVIEW_WORKER_IMAGE }}:${{ needs.release.outputs.tag_name }}
